# XpressIQ Fast Movers First — static site, as deployed on the Hostinger VPS (Docker manager project "xpressiq").
# Project environment (set on the server only): SITE_HOSTS (domains Caddy serves).
# Updating: push to main, then restart/update the project (the web container clones main on start).
services:
  web:
    image: nginx:alpine
    command: ["sh", "-c", "apk add --no-cache git >/dev/null && rm -rf /site && git clone --depth 1 https://github.com/Qr4-holding/xpressiq-reports.git /site && cp /site/site/nginx.conf /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    labels:
      caddy: ${SITE_HOSTS}
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - web
    restart: unless-stopped
networks:
  web:
    external: true
